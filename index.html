<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1a17" />
    <meta name="description" content="手のひらサイズの液晶ペット" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" />
    <title>PULSAR</title>
  </head>
  <body>
    <canvas id="scene" aria-label="液晶ペット本体。A・B・C のボタンを押して操作"></canvas>
    <div id="hint">
      <span class="kbd-only"><kbd>A</kbd>えらぶ <kbd>B</kbd>けってい <kbd>C</kbd>もどる ・ <kbd>Enter</kbd>画面に入る ・ ホイール・矢印でカメラ</span>
      <span class="touch-only">A えらぶ ・ B けってい ・ C もどる ・ 2本指でカメラ</span>
    </div>
    <button id="enter-btn" aria-label="画面に入る">▶ 画面に入る</button>
    <div id="toolbar">
      <button id="view-btn" aria-label="視点の切り替え">視点: みおろし</button>
      <button id="vol-btn" aria-label="音量">音: 中</button>
      <button id="quality" aria-label="画質切替">画質: 高</button>
    </div>
    <button id="dress" aria-expanded="false" aria-controls="dress-panel">きせかえ</button>
    <button id="dex-btn" aria-expanded="false" aria-controls="dex-panel">ずかん</button>
    <section id="dex-panel" hidden aria-label="ずかん">
      <div class="dress-head"><h2>ずかん</h2><button id="dex-close" aria-label="閉じる">とじる</button></div>
      <p id="dex-summary"></p>
      <div id="dex-grid"></div>
      <h3>れきだい</h3>
      <p id="dex-lineage"></p>
    </section>
    <section id="dress-panel" hidden aria-label="きせかえ">
      <div class="dress-head"><h2>きせかえ</h2><button id="dress-close" aria-label="閉じる">とじる</button></div>
      <h3>本体のがら</h3>
      <div id="skin-list" class="chips"></div>
      <h3>いる場所</h3>
      <div id="place-list" class="chips"></div>
      <h3>キャラの表現</h3>
      <div id="chara-list" class="chips"></div>
      <h3>おと</h3>
      <div class="chips">
        <button type="button" class="chip" id="snd-bgm" aria-pressed="true">おんがく 入</button>
        <button type="button" class="chip" id="snd-sfx" aria-pressed="true">こうかおん 入</button>
      </div>
      <p class="snd-note">おとの おおきさは 右上の「音」ボタンで かえられます。</p>
      <h3>データ</h3>
      <div class="chips">
        <button type="button" class="chip" id="data-export">書き出す</button>
        <button type="button" class="chip" id="data-import">読み込む</button>
        <button type="button" class="chip danger" id="data-reset">最初からやり直す</button>
      </div>
      <div id="data-box" hidden>
        <label id="data-label" for="data-code">データのコード</label>
        <textarea id="data-code" rows="3" spellcheck="false" autocomplete="off"></textarea>
        <div class="chips">
          <button type="button" class="chip" id="data-copy">コピー</button>
          <button type="button" class="chip" id="data-download">ファイルに保存</button>
          <button type="button" class="chip" id="data-apply">このコードで読み込む</button>
          <label class="chip file-chip" id="data-file-label">ファイルをえらぶ<input type="file" id="data-file" accept=".txt,.json,text/plain" /></label>
        </div>
      </div>
      <p id="data-msg" aria-live="polite"></p>
    </section>
    <div id="pad" hidden>
      <button id="pad-exit" class="pad-exit" aria-label="本体にもどる">本体にもどる</button>
      <div class="pad-btns">
        <button data-key="A" aria-label="A ボタン">A</button>
        <button data-key="B" aria-label="B ボタン">B</button>
        <button data-key="C" aria-label="C ボタン">C</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
